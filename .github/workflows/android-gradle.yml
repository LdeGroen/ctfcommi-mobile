name: Android build (Gradle — geen EAS-wachtrij)

# Bouwt de Android-AAB rechtstreeks met Gradle op een GitHub-runner (gratis,
# geen EAS-buildwachtrij). Optioneel daarna indienen bij Play via eas submit.
on:
  # Aangeroepen door uitbrengen.yml (met ref = de nieuwe tag), of los voor een
  # testbouw op het huidige nummer.
  workflow_call:
    inputs:
      ref: { type: string, required: false, default: '' }
      wat: { type: string, required: false, default: aab }
      submit: { type: boolean, required: false, default: false }
      naar_commi: { type: boolean, required: false, default: true }
      testschermen: { type: boolean, required: false, default: false }
  workflow_dispatch:
    inputs:
      wat:
        description: 'Wat bouwen?'
        type: choice
        options:
          - aab            # voor de Play Store
          - apk            # los installeerbaar bestand, komt op /commi
          - beide
        default: aab
      submit:
        description: 'Direct indienen bij Play (gesloten test / alpha)? (alleen bij AAB)'
        type: boolean
        default: false
      naar_commi:
        description: 'APK ook op backend/commi zetten? (uit voor een testbouw)'
        type: boolean
        default: true
      testschermen:
        description: 'Testschermen erin (gebaren-test, lang drukken op het logo)? Alleen bij wat=apk en naar_commi uit'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm
        run: npm install -g npm@11

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dependencies installeren
        run: npm ci --no-audit --no-fund

      - name: Native android/-project genereren (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: versionCode op tijdstempel zetten (altijd oplopend)
        run: |
          # versionCode = oplopend getal (vereist door Google). De versionName
          # (leesbaar label) komt uit app.json → expo.version; die hoog je
          # handmatig op per release (semver: 0.1.0 → 0.1.1 → 0.2.0 …).
          VC=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9]\+/versionCode $VC/" android/app/build.gradle
          echo "versionCode = $VC"
          echo "VC=$VC" >> "$GITHUB_ENV"

      - name: Upload-keystore schrijven
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks

      # --- Test-APK (installeerbaar via sideload, gaat NIET naar Play) ---
      - name: APK bouwen (gesigneerd, test)
        if: ${{ inputs.wat == 'apk' || inputs.wat == 'beide' }}
        working-directory: android
        env:
          # Alleen voor een losse test-APK die niet op /commi komt; bij `beide`
          # zou de AAB dezelfde bundel kunnen hergebruiken (src/testschermen.js).
          EXPO_PUBLIC_TESTSCHERMEN: ${{ (inputs.testschermen && inputs.wat == 'apk' && !inputs.naar_commi) && '1' || '' }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: APK als artifact bewaren
        if: ${{ inputs.wat == 'apk' || inputs.wat == 'beide' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Een artifact vraagt een GitHub-account en is na negentig dagen weg. Voor wie
      # geen Play Store gebruikt zetten we het bestand daarom op de backend; die
      # serveert het op /commi.
      - name: APK klaarzetten op backend.cafetheaterfestival.nl/commi
        if: ${{ (inputs.wat == 'apk' || inputs.wat == 'beide') && inputs.naar_commi }}
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          if [ -z "$OPS_TOKEN" ]; then echo "geen OPS_TOKEN - overgeslagen"; exit 0; fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          VERSIE=$(node -p "require('./app.json').expo.version")
          echo "versie $VERSIE, $(du -h "$APK" | cut -f1)"
          code=$(curl -sS -o /tmp/antwoord.txt -w '%{http_code}' \
            -H "X-Ops-Token: $OPS_TOKEN" -H "Accept: application/json" \
            -F "versie=$VERSIE" -F "apk=@$APK" \
            "https://backend.cafetheaterfestival.nl/api/ops/commi-apk") || code=000
          # Alleen de code: deze repo is publiek, en daarmee ook dit log (COM-23).
          echo "antwoord $code"
          [ "$code" = "200" ]

      # --- AAB (voor Play; standaard) ---
      - name: AAB bouwen (gesigneerd)
        if: ${{ inputs.wat == 'aab' || inputs.wat == 'beide' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: AAB als artifact bewaren
        if: ${{ inputs.wat == 'aab' || inputs.wat == 'beide' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: EAS CLI (alleen bij indienen)
        if: ${{ (inputs.wat == 'aab' || inputs.wat == 'beide') && inputs.submit }}
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8, vastgezet (INF-05)
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Indienen bij Play (track uit eas.json — gesloten test/alpha)
        if: ${{ (inputs.wat == 'aab' || inputs.wat == 'beide') && inputs.submit }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          eas submit --platform android --profile production --non-interactive --path "$AAB"

      # De releasenotes uit CHANGELOG.md bij deze release in Play zetten. Zonder
      # secret of bij een fout alleen een waarschuwing: notities houden een
      # uitgave nooit tegen. Zie scripts/storenotities.mjs.
      - name: Releasenotes in Google Play (uit CHANGELOG.md)
        if: ${{ (inputs.wat == 'aab' || inputs.wat == 'beide') && inputs.submit }}
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/storenotities.mjs android "$(node -p "require('./app.json').expo.version")" "$VC"
