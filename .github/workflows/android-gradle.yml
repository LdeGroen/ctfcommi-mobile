name: Android build (Gradle — geen EAS-wachtrij)

# Bouwt de Android-AAB rechtstreeks met Gradle op een GitHub-runner (gratis,
# geen EAS-buildwachtrij). Optioneel daarna indienen bij Play via eas submit.
on:
  workflow_dispatch:
    inputs:
      apk:
        description: 'Test-APK bouwen (installeerbaar op telefoon, NIET naar Play)?'
        type: boolean
        default: false
      submit:
        description: 'Direct indienen bij Play (gesloten test / alpha)? (alleen bij AAB)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm
        run: npm install -g npm@11

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dependencies installeren
        run: npm ci --no-audit --no-fund

      - name: Native android/-project genereren (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: versionCode op tijdstempel zetten (altijd oplopend)
        run: |
          # versionCode = oplopend getal (vereist door Google). De versionName
          # (leesbaar label) komt uit app.json → expo.version; die hoog je
          # handmatig op per release (semver: 0.1.0 → 0.1.1 → 0.2.0 …).
          VC=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9]\+/versionCode $VC/" android/app/build.gradle
          echo "versionCode = $VC"

      - name: Upload-keystore schrijven
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload.jks

      # --- Test-APK (installeerbaar via sideload, gaat NIET naar Play) ---
      - name: APK bouwen (gesigneerd, test)
        if: ${{ github.event.inputs.apk == 'true' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: APK als artifact bewaren
        if: ${{ github.event.inputs.apk == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # --- AAB (voor Play; standaard) ---
      - name: AAB bouwen (gesigneerd)
        if: ${{ github.event.inputs.apk != 'true' }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: AAB als artifact bewaren
        if: ${{ github.event.inputs.apk != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: EAS CLI (alleen bij indienen)
        if: ${{ github.event.inputs.apk != 'true' && github.event.inputs.submit == 'true' }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Indienen bij Play (track uit eas.json — gesloten test/alpha)
        if: ${{ github.event.inputs.apk != 'true' && github.event.inputs.submit == 'true' }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          eas submit --platform android --profile production --non-interactive --path "$AAB"
