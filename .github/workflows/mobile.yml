name: Build & submit mobile (EAS)

# Handmatig starten (kies platform), of automatisch bij een versie-tag (vX.Y.Z).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        type: choice
        options: [all, ios, android]
        default: all
      uitgave:
        description: 'Soort uitgave (bepaalt zelf het nieuwe versienummer)'
        type: choice
        options: [patch, minor, major, geen]
        default: patch
      submit:
        description: 'Direct indienen bij de stores?'
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write   # tag pushen bij een uitgave

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # we hebben de tags nodig om te kunnen ophogen

      # Welk versienummer wordt het? Bij een handmatige uitgave hoogt de
      # workflow zelf op en zet de tag; push je zelf een tag, dan is die
      # leidend. Zo hoeft er met de hand niets meer getagd te worden.
      - name: Versienummer bepalen
        id: versie
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSIE=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${{ inputs.uitgave }}" = "geen" ]; then
            echo "Geen versieverhoging — bouwt op het huidige nummer."
            exit 0
          fi

          VANTAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          VANTAG="${VANTAG#v}"
          INBESTAND=$(node -p "require('./app.json').expo.version")
          NIEUW=$(node -e "
            const soort = process.argv[3];
            const naar = (v) => (v || '0.0.0').split('.').map(Number).map((n) => n || 0);
            const hoogste = [process.argv[1], process.argv[2]]
              .map(naar)
              .sort((x, y) => (y[0] - x[0]) || (y[1] - x[1]) || (y[2] - x[2]))[0];
            const [a, b, c] = hoogste;
            console.log(soort === 'major' ? [a + 1, 0, 0].join('.')
                      : soort === 'minor' ? [a, b + 1, 0].join('.')
                      : [a, b, c + 1].join('.'));
          " "$VANTAG" "$INBESTAND" "${{ inputs.uitgave }}")

          echo "Laatste tag: ${VANTAG:-geen} · in het bestand: $INBESTAND → nieuwe: $NIEUW"
          git tag "v$NIEUW"
          git push origin "v$NIEUW"
          echo "VERSIE=$NIEUW" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # De lockfile is met npm 11 gegenereerd; pin de runner-npm zodat npm ci klopt.
      - name: Pin npm
        run: npm install -g npm@11

      # Node modules nodig zodat EAS de config-plugins (expo-notifications e.d.)
      # kan resolven bij het lezen van app.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: EAS CLI installeren + inloggen
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # De tag is leidend voor het versienummer, zodat de app en de store
      # hetzelfde nummer noemen als de updatecheck.
      - name: Versienummer invullen
        if: env.VERSIE != ''
        shell: bash
        run: |
          echo "Versie wordt: $VERSIE"
          node -e "
            const fs = require('fs');
            const versie = process.argv[1];
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.version = versie;
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2) + '\n');
            const pk = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pk.version = versie;
            fs.writeFileSync('package.json', JSON.stringify(pk, null, 2) + '\n');
          " "$VERSIE"

      - name: Build (+ optioneel indienen) op EAS
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          SUBMIT="${{ github.event.inputs.submit }}"
          # --wait: GitHub wacht op de EAS-build en wordt rood als die faalt
          # (anders zie je een fout pas op EAS). De job draait dan langer.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "$SUBMIT" = "true" ]; then
            eas build --platform "$PLATFORM" --profile production --non-interactive --wait

      # De app vraagt de backend of hij achterloopt; hier melden we wat er net
      # is uitgebracht. Alleen bij een tag én als het ook echt is ingediend —
      # anders staat het in de store nog niet klaar en stuur je mensen voor
      # niets naar een versie die er nog niet is.
      - name: Nieuwe versie melden aan de backend
        if: ${{ env.VERSIE != '' && (github.event_name == 'push' || inputs.submit) }}
        continue-on-error: true
        shell: bash
        env:
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
        run: |
          if [ -z "$OPS_TOKEN" ]; then echo "geen OPS_TOKEN — overgeslagen"; exit 0; fi
          VERSIE=$(node -p "require('./app.json').expo.version")
          for PLAT in android ios; do
            code=$(curl -sS -o antwoord.txt -w '%{http_code}' --max-time 30 -X POST \
              -H "X-Ops-Token: $OPS_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
              -d "{\"platform\":\"$PLAT\",\"versie\":\"$VERSIE\"}" \
              "https://backend.cafetheaterfestival.nl/api/ops/app-versie") || code=000
            echo "$PLAT melden: HTTP $code · $(cat antwoord.txt)"
          done --auto-submit
          else
            eas build --platform "$PLATFORM" --profile production --non-interactive --wait
          fi
