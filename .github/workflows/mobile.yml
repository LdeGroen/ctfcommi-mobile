name: Build & submit mobile (EAS)

# Handmatig starten (kies platform), of automatisch bij een versie-tag (vX.Y.Z).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: 'Direct indienen bij de stores?'
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # De lockfile is met npm 11 gegenereerd; pin de runner-npm zodat npm ci klopt.
      - name: Pin npm
        run: npm install -g npm@11

      # Node modules nodig zodat EAS de config-plugins (expo-notifications e.d.)
      # kan resolven bij het lezen van app.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: EAS CLI installeren + inloggen
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (+ optioneel indienen) op EAS
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          SUBMIT="${{ github.event.inputs.submit }}"
          # --wait: GitHub wacht op de EAS-build en wordt rood als die faalt
          # (anders zie je een fout pas op EAS). De job draait dan langer.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "$SUBMIT" = "true" ]; then
            eas build --platform "$PLATFORM" --profile production --non-interactive --wait --auto-submit
          else
            eas build --platform "$PLATFORM" --profile production --non-interactive --wait
          fi
