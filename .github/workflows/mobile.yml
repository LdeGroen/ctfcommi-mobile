name: iOS bouwen en indienen (EAS)

# Aangeroepen door uitbrengen.yml, met ref = de nieuwe tag. Los starten kan
# ook: dan bouwt hij het nummer dat in app.json staat, bijvoorbeeld opnieuw na
# een afwijzing. Ophogen en taggen doet alleen uitbrengen.yml (23-11-2026);
# tot dan deed deze workflow dat ook, maar dan kwam het nummer niet in app.json
# en bouwde android-gradle.yml een ander nummer.
#
# Android hoort hier niet meer: dat gaat via android-gradle.yml (eigen
# versionCode, geen EAS-wachtrij).
on:
  workflow_call:
    inputs:
      ref: { type: string, required: false, default: '' }
      submit: { type: boolean, required: false, default: true }
  workflow_dispatch:
    inputs:
      submit:
        description: 'Direct indienen bij App Store Connect?'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # De lockfile is met npm 11 gegenereerd; pin de runner-npm zodat npm ci klopt.
      - name: Pin npm
        run: npm install -g npm@11

      # Node modules nodig zodat EAS de config-plugins (expo-notifications e.d.)
      # kan resolven bij het lezen van app.json.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: EAS CLI installeren + inloggen
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e  # v8, vastgezet (INF-05)
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bouwen (+ indienen) op EAS
        run: |
          echo "Versie: $(node -p "require('./app.json').expo.version")"
          # --wait: GitHub wacht op de EAS-build en wordt rood als die faalt.
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform ios --profile production --non-interactive --wait --auto-submit
          else
            eas build --platform ios --profile production --non-interactive --wait
          fi

      # "Wat is er nieuw" in App Store Connect invullen uit CHANGELOG.md. Alleen
      # dat veld; de rest van de storevermelding blijft zoals hij is. Zonder
      # secrets of bij een fout alleen een waarschuwing. Zie scripts/storenotities.mjs.
      - name: '"Wat is er nieuw" in de App Store (uit CHANGELOG.md)'
        if: ${{ inputs.submit }}
        continue-on-error: true
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/storenotities.mjs ios "$(node -p "require('./app.json').expo.version")"
